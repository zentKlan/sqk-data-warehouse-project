services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "zentar*klan69"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backups
      - ./sql-data-warehouse-project/01_datasets/source_crm:/var/opt/mssql/datasets/crm
      - ./sql-data-warehouse-project/01_datasets/source_erp:/var/opt/mssql/datasets/erp

volumes:
  mssql_data:
